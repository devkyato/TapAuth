name: Bug report
description: Report a reproducible TapAuth problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include student data, NFC UIDs, passwords, tokens, or `.env` contents.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start TapAuth\n2. Tap a card\n3. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Raspberry Pi model, OS version, Python version, browser, and reader model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
