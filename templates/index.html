<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapAuth Registration</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <a class="brand" href="/login">
                <img src="/static/apc_logo.png" alt="Asia Pacific College School of Engineering">
                <span>
                    <strong>TapAuth</strong>
                    <small>Registration Dashboard</small>
                </span>
            </a>
            <nav class="nav">
                <a class="active" href="/airhub-register">Register</a>
                <a href="/login">Logs</a>
            </nav>
        </header>

        <section class="status-strip" aria-live="polite">
            <div>
                <span class="label">Reader</span>
                <strong id="readerStatus">Checking...</strong>
            </div>
            <div>
                <span class="label">Database</span>
                <strong id="databaseStatus">Checking...</strong>
            </div>
            <div>
                <span class="label">Network</span>
                <strong id="wifiStatus">Configured locally</strong>
            </div>
        </section>

        <section class="workspace two-column">
            <div class="panel">
                <div class="panel-head">
                    <p class="eyebrow">Current Tap</p>
                    <h1>Scan card first. Then assign the profile.</h1>
                </div>
                <div class="scan-card">
                    <span class="pulse"></span>
                    <div>
                        <span class="label">NFC Code</span>
                        <strong id="scanPreview">Waiting for card</strong>
                    </div>
                </div>
                <p id="formMessage" class="message"></p>
            </div>

            <form class="panel form-grid" id="registrationForm" action="/register" method="post">
                <input type="hidden" id="access_code" name="access_code" value="{{ access_code }}">
                <label>
                    <span>Student/Employee No.</span>
                    <input type="text" id="student_no" name="student_no" autocomplete="off" required>
                </label>
                <label>
                    <span>Last Name</span>
                    <input type="text" id="lastname" name="lastname" autocomplete="family-name" required>
                </label>
                <label>
                    <span>First Name</span>
                    <input type="text" id="firstname" name="firstname" autocomplete="given-name" required>
                </label>
                <label>
                    <span>Middle Name</span>
                    <input type="text" id="middlename" name="middlename" autocomplete="additional-name">
                </label>
                <label>
                    <span>Program</span>
                    <input type="text" id="course" name="course" placeholder="BSECE, BSCPE, FACULTY" required>
                </label>
                <label>
                    <span>Project Type</span>
                    <input type="text" id="project_type" name="project_type" placeholder="PBL or FACULTY" required>
                </label>
                <label>
                    <span>Room</span>
                    <input type="text" id="room" name="room" required>
                </label>
                <label>
                    <span>NFC Code</span>
                    <input type="text" id="nfc_code" name="nfc_code" readonly required>
                </label>
                <button class="primary-action" type="submit">Assign Card</button>
            </form>
        </section>
    </main>

    <script>
        let tapCounter = 0;
        const $ = (selector) => document.querySelector(selector);

        function setMessage(text, type) {
            $('#formMessage').className = 'message' + (type ? ' ' + type : '');
            $('#formMessage').textContent = text || '';
        }

        function refreshStatus() {
            fetch('/system_status')
                .then((response) => response.json())
                .then((data) => {
                    $('#readerStatus').textContent = data.scanner.connected ? 'Connected' : 'Standby';
                    $('#databaseStatus').textContent = data.database.connected
                        ? `Local ${String(data.database.driver || 'database').toUpperCase()}`
                        : 'Needs setup';
                    $('#wifiStatus').textContent = data.wifi.ssid || 'Not configured';
                });
        }

        function pollLatestTap() {
            fetch('/latest_tap?since=' + tapCounter)
                .then((response) => response.json())
                .then((resp) => {
                if (!resp.changed) {
                    return;
                }
                tapCounter = resp.tap_counter;
                $('#nfc_code').value = resp.uid || '';
                $('#scanPreview').textContent = resp.uid || 'Waiting for card';
                setMessage('Card captured and ready to assign. Complete the profile, then register.', 'success');
            });
        }

        $('#registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            fetch('/register', {
                method: 'POST',
                body: new FormData(this),
            })
                .then((response) => response.ok ? response.json() : response.json().then((data) => Promise.reject(data)))
                .then((response) => {
                    setMessage(response.message || 'Registration successful.', 'success');
                    $('#registrationForm').reset();
                    $('#scanPreview').textContent = 'Waiting for card';
                })
                .catch((response) => {
                    setMessage(response.error || 'Registration failed.', 'error');
                });
        });

        refreshStatus();
        setInterval(refreshStatus, 5000);
        setInterval(pollLatestTap, 900);
    </script>
</body>
</html>
