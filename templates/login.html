<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APC Airhub Tap-In</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="tap-page">
    <main class="tap-shell">
        <header class="tap-header">
            <img src="/static/soe_airhub_logo.png" alt="Asia Pacific College School of Engineering">
            <h1>APC Airhub</h1>
            <p>School of Engineering</p>
            <time id="clock">--:--</time>
        </header>

        <section class="tap-stage" aria-live="polite">
            <p class="tap-kicker">Tap your NFC card</p>
            <h2 id="tapMessage">Ready for tap-in</h2>
            <p id="tapSubtext">Your tap-in or tap-out will be recorded automatically.</p>
        </section>

        <section class="logs-panel tap-logs">
            <div class="logs-head">
                <div>
                    <p>Latest activity</p>
                    <h2>Recent Logs</h2>
                </div>
                <button class="secondary-action" type="button" id="refreshLogs">Refresh</button>
            </div>
            <div class="table-wrap">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Last Name</th>
                            <th>First Name</th>
                            <th>Student No.</th>
                            <th>Time Entered</th>
                            <th>Time Left</th>
                            <th>Stayed</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody">
                        <tr><td colspan="7">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="logsMessage" class="message"></p>
        </section>
    </main>

    <script>
        let tapCounter = 0;
        let greetingTimer = null;
        let lastLogsKey = '';
        let latestTapBusy = false;
        let logsBusy = false;
        const $ = (selector) => document.querySelector(selector);

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(char) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char];
            });
        }

        function updateClock() {
            $('#clock').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        }

        function showGreeting(message) {
            clearTimeout(greetingTimer);
            const tapMessage = document.getElementById('tapMessage');
            tapMessage.classList.remove('tap-flash');
            tapMessage.textContent = message || 'Tap recorded';
            tapMessage.classList.add('tap-flash');
            $('#tapSubtext').textContent = message && message.toLowerCase().startsWith('log out')
                ? 'Time left saved. Thank you.'
                : 'Time-in saved. Welcome.';
            greetingTimer = setTimeout(function() {
                tapMessage.classList.remove('tap-flash');
                tapMessage.textContent = 'Ready for tap-in or tap-out';
                $('#tapSubtext').textContent = 'Your next tap will be recorded automatically.';
            }, 3200);
        }

        function renderLogs(rows) {
            if (!Array.isArray(rows) || rows.length === 0) {
                if (lastLogsKey !== 'empty') {
                    $('#logsBody').innerHTML = '<tr><td colspan="7">No logs yet.</td></tr>';
                    lastLogsKey = 'empty';
                }
                return;
            }
            const visibleRows = rows.slice(0, 6);
            const nextKey = visibleRows.map((row) => row.id + ':' + row.status + ':' + (row.duration_label || '')).join('|');
            if (nextKey === lastLogsKey) return;
            lastLogsKey = nextKey;
            const html = visibleRows.map(function(row) {
                return `<tr>
                    <td><span class="status-pill">${escapeHtml(row.event_type)}</span></td>
                    <td>${escapeHtml(row.lastname)}</td>
                    <td>${escapeHtml(row.firstname)}</td>
                    <td>${escapeHtml(row.student_no)}</td>
                    <td>${escapeHtml(row.time_entered)}</td>
                    <td>${escapeHtml(row.time_left || '')}</td>
                    <td>${escapeHtml(row.duration_label || '')}</td>
                </tr>`;
            }).join('');
            $('#logsBody').innerHTML = html;
        }

        function fetchLogs() {
            if (logsBusy) return;
            logsBusy = true;
            fetch('/user_logs_info')
                .then((response) => response.ok ? response.json() : Promise.reject(response))
                .then((data) => {
                    renderLogs(data);
                    $('#logsMessage').className = 'message';
                    $('#logsMessage').textContent = '';
                })
                .catch(() => {
                    $('#logsMessage').className = 'message error';
                    $('#logsMessage').textContent = 'Unable to load logs.';
                })
                .finally(() => { logsBusy = false; });
        }

        function pollLatestTap() {
            if (latestTapBusy) return;
            latestTapBusy = true;
            fetch('/latest_tap?since=' + tapCounter)
                .then((response) => response.json())
                .then((resp) => {
                if (!resp.changed) return;
                tapCounter = resp.tap_counter;
                showGreeting(resp.message || 'Tap recorded');
                fetchLogs();
            })
                .catch(() => {})
                .finally(() => { latestTapBusy = false; });
        }

        $('#refreshLogs').addEventListener('click', fetchLogs);
        updateClock();
        fetchLogs();
        setInterval(updateClock, 15000);
        setInterval(pollLatestTap, 1200);
    </script>
</body>
</html>
